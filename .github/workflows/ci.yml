name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend-and-pi:
    name: Go, PostgreSQL and Pi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: novel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: novel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel -d novel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_PROVIDER: fake
      TEST_DATABASE_URL: postgres://novel:ci-only-password@127.0.0.1:5432/novel?sslmode=disable
      PDF_FONT_PATH: ${{ github.workspace }}/assets/fonts/NotoSansSC-Regular.ttf
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Install and compile Pi harness
        run: |
          npm --prefix harness ci --no-audit --no-fund
          npm --prefix harness run build
          npm --prefix harness run bundle
      - name: Test Pi source and standalone bundle
        run: |
          npm --prefix harness test
          HARNESS_TEST_ENTRY="$GITHUB_WORKSPACE/harness/bundle/main.mjs" npm --prefix harness test
      - name: Make Linux Node available to portable-runtime test fixtures
        # Existing Go fixtures use this Windows portable-runtime pathname.
        # The link runs the Linux Node installed above; it is never committed.
        run: |
          mkdir -p .tools/node-v24.22.3-win-x64
          ln -s "$(command -v node)" .tools/node-v24.22.3-win-x64/node.exe
          test -r "$PDF_FONT_PATH"
          .tools/node-v24.22.3-win-x64/node.exe --version
          go version
      - name: Verify and vet Go modules
        run: |
          go mod verify
          go vet ./...
      - name: Run complete PostgreSQL and tool-loop tests
        run: |
          go test ./... -json -count=1 -timeout=420s | tee backend-tests.jsonl
      - name: Reject silently skipped tests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('backend-tests.jsonl').read_text().splitlines() if line.strip()]
          skipped = [event for event in events if event.get('Action') == 'skip' and event.get('Test')]
          passed = [event for event in events if event.get('Action') == 'pass' and event.get('Test') and '/' not in event['Test']]
          print(f"Passed {len(passed)} top-level tests; skipped {len(skipped)} tests.")
          assert passed, 'No top-level tests ran'
          assert not skipped, 'Required integration coverage was skipped: ' + ', '.join(event['Test'] for event in skipped)
          PY
      - name: Build API and worker
        run: |
          mkdir -p build
          go build -trimpath -o build/api ./cmd/api
          go build -trimpath -o build/worker ./cmd/worker
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: backend-tests.jsonl
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Typecheck and unit tests
        run: |
          npm --prefix web run typecheck
          npm --prefix web run test -- --run
      - name: Build production interface
        run: npm --prefix web run build
