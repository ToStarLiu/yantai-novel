services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: novel
      POSTGRES_DB: novel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env before starting Compose}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["migrate", "up"]
    environment: &app_environment
      DATABASE_URL: postgres://novel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/novel?sslmode=disable
      AUTHOR_USERNAME: ${AUTHOR_USERNAME:-author}
      AUTHOR_PASSWORD: ${AUTHOR_PASSWORD:?Set AUTHOR_PASSWORD}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_WIRE_API: ${LLM_WIRE_API:-responses}
      LLM_ACTOR_AUTHORIZATION: ${LLM_ACTOR_AUTHORIZATION:-}
      APP_PROVIDER: ${APP_PROVIDER:-auto}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-3000}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      RUN_WORKER: "false"
      PROVIDER_MASTER_KEY_PATH: /app/data/provider-master.key
    volumes: &app_volumes
      - app_secrets:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *app_environment
    volumes: *app_volumes
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/worker"]
    environment: *app_environment
    volumes: *app_volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  app_secrets:
